[tool.poetry]
name = "rag-shared"
version = "0.1.0"
description = "Shared FAISS embedder and vector store library"
authors = ["kurodayu23"]
packages = [{include = "shared"}]

[tool.poetry.dependencies]
python = ">=3.11,<3.13"
faiss-cpu = "1.8.0.post1"
numpy = "^1.26.0"
transformers = "4.46.3"
torch = {version = "2.5.1+cpu", source = "pytorch-cpu"}

[tool.poetry.group.dev.dependencies]
pytest = ">=8.2.0"
pytest-cov = "^5.0.0"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[[tool.poetry.source]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
priority = "explicit"
