name: monorepo-ci

on:
  push:
    branches: [ "main" ]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [shared, service-api, service-rag]
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Poetry
        run: pip install poetry==1.8.3
      - name: Install dependencies
        run: poetry check --lock && poetry install --no-interaction --all-extras
      - name: Run tests
        run: poetry run pytest -q

  integration-tests:
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install test deps
        run: pip install pytest httpx
      - name: Start services
        run: docker compose -f docker-compose.integration.yml up -d --build --wait --wait-timeout 300
      - name: Run integration tests
        run: pytest integration_tests -q
      - name: Teardown
        if: always()
        run: docker compose -f docker-compose.integration.yml down -v
